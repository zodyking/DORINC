# Local-only CUPS for DORINC PrintHarbor. The web process talks to this
# daemon with lp / lpstat / lpadmin. Do not expose port 631 publicly.
LogLevel warn
MaxLogSize 1m
Listen localhost:631
Listen /run/cups/cups.sock
Browsing No
DefaultAuthType None
WebInterface No
ErrorPolicy retry-job
FileDevice Yes

<Location />
  Order allow,deny
  Allow localhost
</Location>

<Location /admin>
  Order allow,deny
  Allow localhost
</Location>

<Location /admin/conf>
  AuthType None
  Order allow,deny
  Allow localhost
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default
  <Limit All>
    Order allow,deny
    Allow localhost
  </Limit>
</Policy>
